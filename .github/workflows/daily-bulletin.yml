name: Bản tin hằng ngày

# 06:17 giờ Bangkok = 23:17 UTC ngày hôm trước.
#
# KHÔNG đặt đúng phút 0: GitHub ghi rõ schedule bị trễ nặng vào đầu mỗi giờ
# ("high load times include the start of every hour"), thậm chí bị bỏ (dropped).
# Lần chạy 06/11 đã trễ từ 06:00 lên 10:10 Bangkok vì lý do này.
#
# Lượt thứ hai 07:47 Bangkok là DỰ PHÒNG. An toàn vì write-bulletin.mjs idempotent:
# đã có file hôm nay thì dừng (exit 0), không ghi đè, không tạo bản tin trùng.
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "47 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Không tự chặn trùng ở đây — write-bulletin.mjs đã idempotent:
      # nếu đã có file hôm nay thì tự dừng (exit 0), không ghi đè.
      - name: Thu thập tin từ RSS
        run: node scripts/ingest.mjs

      - name: Gọi Sonnet 5.5 chọn và phân tích tin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://apiclan.us/v1' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
        run: node scripts/generate.mjs

      - name: Ghi file bản tin
        id: write
        run: node scripts/write-bulletin.mjs

      - name: Kiểm tra nội dung
        run: npm run validate

      - name: Build thử
        run: npm run build

      - name: Commit và push
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news/
          if git diff --staged --quiet; then
            echo "Không có thay đổi để commit (bản tin $TODAY đã tồn tại từ trước)."
          else
            git commit -m "Bản tin tự động $TODAY"
            git push
            echo "Đã push bản tin $TODAY. Vercel sẽ tự deploy."
          fi

      - name: Lưu bản nháp khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-debug
          path: _ingest/
          retention-days: 7
          if-no-files-found: ignore
